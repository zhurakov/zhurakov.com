  <body>
    <canvas aria-label="Interactive fluid simulation"></canvas>

    <header class="antistress-header">
      <a href="../index.html">← Home</a>
      <p>ANTISTRESS</p>
    </header>

    <main class="antistress-panel">
      <p>Touch or drag the fluid.</p>
      <div class="antistress-controls">
        <button id="fluid-splat" type="button">Surprise me</button>
        <button id="fluid-pause" type="button" aria-pressed="false">Pause</button>
      </div>
    </main>

    <footer>
      <p>
        Simulation by <a href="https://github.com/PavelDoGreat/WebGL-Fluid-Simulation">Pavel Dobryakov</a>
        · <a href="../licenses/webgl-fluid-simulation-MIT.txt">MIT License</a>
      </p>
    </footer>

    <script src="fluid.js"></script>
    <script>
      const pauseButton = document.querySelector('#fluid-pause');
      const splatButton = document.querySelector('#fluid-splat');

      pauseButton.addEventListener('click', () => {
        config.PAUSED = !config.PAUSED;
        pauseButton.textContent = config.PAUSED ? 'Resume' : 'Pause';
        pauseButton.setAttribute('aria-pressed', String(config.PAUSED));
      });

      splatButton.addEventListener('click', () => {
        splatStack.push(Math.floor(Math.random() * 16) + 8);
      });
    </script>
  </body>
