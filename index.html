    <link

      href="fonts/Press_Start_2P/PressStart2P-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/robot-guide.css" />
    <script type="module" src="js/robot-guide.js"></script>
    <script
      src="js/analytics-consent.js"
      data-ga-id="G-DEYFTK64Q3"
      data-privacy-url="privacy.html"
      defer
    ></script>
    <script src="js/support-feedback.js" defer></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Nikita Zhurakov",
        "url": "https://zhurakov.com/",
        "sameAs": ["https://github.com/zhurakov"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Zhurakov",
        "alternateName": ["Nikita Zhurakov", "zhurakov.com"],
        "url": "https://zhurakov.com/"
      }
    </script>
  </head>

  <body>
    <header>
      <h1 class="neon-text">Hello, World!</h1>
    </header>

    <main>
      <div class="hero-art" id="hero">
        <img fetchpriority="high" decoding="sync" class="original-art" src="images/robot-guide/workbench.png" alt="Nikita building a little robot" width="400" height="225">
        <span class="parked-robot" aria-hidden="true"></span>
        <button type="button" id="wake-robot" class="wake-target" aria-label="Wake the robot" title="Click the robot"></button>
      </div>
      <nav id="menu" aria-label="Site navigation">
        <a href="posts/games.html">Games</a>
        <a href="posts/links.html">Links</a>
        <a href="posts/music.html">Music</a>
        <a href="antistress/">Antistress</a>
        <a href="posts/projects.html">Projects</a>
      </nav>
      <p class="support-note">
        Enjoying the site? <a href="https://boosty.to/zhurakov/donate" target="_blank" rel="noopener noreferrer" data-support-feedback>Keep it alive — Support ♥</a>
      </p>
      <section class="robot-stage" id="stage" aria-label="Chat with the robot">
        <div class="robot-dock" id="dock"></div>
        <div class="conversation" id="conversation" aria-live="polite" inert>
          <div class="speech" id="speech">Hey! How can I help?</div>
          <div class="choices">
            <button type="button" data-question="Show me projects">Show me projects</button>
            <button type="button" data-question="About Nikita">About Nikita</button>
          </div>
          <form id="ask-form">
            <label class="sr-only" for="ask">Ask the robot</label>
            <input id="ask" placeholder="Your question…" autocomplete="off" maxlength="200">
            <button type="submit" aria-label="Send question">↵</button>
          </form>
          <button type="button" id="close-chat" class="close-chat">Close chat</button>
          <p class="robot-note">Projects, games, and a bit about Nikita.</p>
        </div>
      </section>
      <article id="cube">
        <sub>
          <button
            class="rubik"
            type="button"
            aria-label="Spin the hello cube"
          >
            <span>Hello</span>
            <span>off</span>
            <span>fuck</span>
            <span>and</span>
          </button>
        </sub>
      </article>
    </main>

    <footer>
      <div class="footer-row">
        <a href="index.html" class="brand-label">
          <picture>
            <source srcset="images/indie-coder.webp" type="image/webp" />
            <img
              src="images/indie-coder.png"
              alt="Whoami brand"
              width="92"
              height="48"
              decoding="async"
            />
          </picture>
        </a>

        <a
          class="github-footer-link"
          href="https://github.com/zhurakov/zhurakov.com"
          rel="me"
        >
          <img src="images/github-lockup-white.svg" alt="GitHub" width="86" height="20" />
        </a>

        <p class="copyright">
          <a
            class="cc-link"
            rel="license"
            href="https://creativecommons.org/licenses/by-sa/4.0/"
          >
            CC BY-SA 4.0
          </a>
          <img
            class="cc-icon"
            src="images/cc/cc.svg"
            alt="CC"
          />
          <img
            class="cc-icon"
            src="images/cc/by.svg"
            alt="BY"
          />
          <img
            class="cc-icon"
            src="images/cc/sa.svg"
            alt="SA"
          />
        </p>
      </div>
    </footer>
    <canvas id="driving-robot" width="200" height="176" aria-hidden="true" role="button" tabindex="-1" aria-label="Open robot chat"></canvas>
  </body>
</html>
